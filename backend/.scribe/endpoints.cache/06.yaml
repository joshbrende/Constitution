        content: '{"data":{"history":"ZANU PF is the party that led Zimbabwe to independence in 1980 and continues to champion national unity, constitutional order, and development.\n\nThis app connects members to the Party Constitution, national constitutional literacy, Academy programmes, and structured dialogue with leadership.","vision":"An empowered, united, and prosperous Zimbabwe anchored in constitutional democracy and Vision 2030.","mission":"To mobilise, educate, and organise members to deliver people-centred development, defend constitutional values, and strengthen Party structures at every level.","article_body":"Name of the Party\n1. The name of the Party shall be the Zimbabwe African National Union Patriotic Front [hereinafter referred to as \"ZANU PF\" or \"the Party\"].\n\n2. The Party shall be a body corporate with perpetual succession, capable of suing and being sued, acquiring and disposing of property, acquiring rights and incurring obligations and engaging in any lawful activities which are not inconsistent with its aims and objectives.\n\nOfficial Seal\n3. There shall be a seal of the Party which shall be kept by the President and First Secretary and shall be used under the direction and control of the President of the Party.\n\nOfficial Flag\n4. The Party shall have an official flag as approved by Congress, comprising of the colours of green, yellow, red and black.\nGreen - represents the vegetation, the life, flora and fauna, agriculture, growth, hope of continuity as a sovereign people.\nYellow - represents Zimbabwe''s abundant mineral wealth, such as diamonds, platinum, gold, coal, methane gas, nickel, copper, iron, chrome, emeralds and others.\nRed - represents the blood of the sons and daughters of the liberation struggle.\nBlack - represents the indigenous people as the sovereign owners and custodians of our motherland Zimbabwe.\n\nParty Headquarters\n5. The Head Office of the Party shall be in Harare.\n\nVision\n6. Forever to remain the mass revolutionary socialist Party in the emancipation process of the people of Zimbabwe from all forms of oppression.\n\nMission\n7. To maintain total ownership, control and equitable distribution of the means of production, natural resources, and the defence of the national sovereignty, policies of indigenisation, empowerment and wealth creation so as to sustain the independence of Zimbabwe; and to remain forever masters of our own destiny.","leagues":[{"slug":"veterans-league","name":"Veterans League","leader_name":"Leader, Veterans League","leader_title":"National Chairperson","body":"<p>The Veterans League honours those who sacrificed for liberation and supports their welfare, mentorship, and continued service to the Party and nation.<\/p>"},{"slug":"womens-league","name":"Women''s League","leader_name":"Leader, Women''s League","leader_title":"National Chairperson","body":"<p>The Women''s League advances gender equality, economic empowerment, and leadership development for women across provinces, districts, and branches.<\/p>"},{"slug":"youth-league","name":"Youth League","leader_name":"Leader, Youth League","leader_title":"National Chairperson","body":"<p>The Youth League develops young cadres through education, skills, entrepreneurship, and disciplined participation in Party organs and national programmes.<\/p>"}],"related_sections":[],"veterans_league":{"leader_name":"Leader, Veterans League","leader_title":"National Chairperson","body":"<p>The Veterans League honours those who sacrificed for liberation and supports their welfare, mentorship, and continued service to the Party and nation.<\/p>"},"womens_league":{"leader_name":"Leader, Women''s League","leader_title":"National Chairperson","body":"<p>The Women''s League advances gender equality, economic empowerment, and leadership development for women across provinces, districts, and branches.<\/p>"},"youth_league":{"leader_name":"Leader, Youth League","leader_title":"National Chairperson","body":"<p>The 