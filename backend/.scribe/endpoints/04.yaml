name: Certificates
description: |-

  Certificate preview, generation, and PDF download (when enabled for the deployment).
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/certificates/preview
    metadata:
      custom: []
      groupName: Certificates
      groupDescription: |-

        Certificate preview, generation, and PDF download (when enabled for the deployment).
      subgroup: ''
      subgroupDescription: ''
      title: 'Preview certificate PDF'
      description: |-
        Streams a sample certificate PDF using the authenticated user's name (or placeholder data).
        Requires `certificates:read` ability.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"error":"unauthenticated","message":"Unauthenticated."}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-request-id: a51bb280-3669-4e4e-a270-143a803680b7
          vary: Origin
        description: null
      -
        custom: []
        status: 503
        content: '{"message":"Certificate generation is not available. Template or PDF library missing."}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/certificates
    metadata:
      custom: []
      groupName: Certificates
      groupDescription: |-

        Certificate preview, generation, and PDF download (when enabled for the deployment).
      subgroup: ''
      subgroupDescription: ''
      title: 'List my certificates'
      description: |-
        Returns issued certificates with `pdf_status` for polling. When the government workflow is active,
        returns an empty list and points clients to academy applications instead.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data":[{"id":1,"certificate_number":"ZPF-MEM-2026-00001","pdf_status":"ready","issued_at":"2026-04-01T12:00:00+00:00"}]}'
        headers: []
        description: ''
      -
        custom: []
        status: 200
        content: '{"data":[],"meta":{"certificates_disabled":true,"message":"Certificates are processed after payment and Presidium approval. View your payment receipt under Academy applications.","applications_url":"/api/v1/academy/applications"}}'
        headers: []
        description: 'Workflow mode'
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/v1/certificates/{certificate_id}/pdf'
    metadata:
      custom: []
      groupName: Certificates
      groupDescription: |-

        Certificate preview, generation, and PDF download (when enabled for the deployment).
      subgroup: ''
      subgroupDescription: ''
      title: 'Download certificate PDF'
      description: 'Streams the PDF when ready; otherwise returns 202 with `pdf_status` and may queue generation.'
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      certificate_id:
        custom: []
        name: certificate_id
        description: 'The ID of the certificate.'
        required: true
        example: 17
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      certificate:
        custom: []
        name: certificate
        description: 'Certificate ID.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      certificate_id: 17
      certificate: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 202
        content: '{"message":"PDF is not ready yet. Poll certificates list or generate endpoint for status.","pdf_status":"generating"}'
        headers: []
        description: ''
      -
        custom: []
        status: 503
        content: '{"message":"Certificate generation is not available. Template or PDF library missing."}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/certificates/{certificate_id}/generate'
    metadata:
      custom: []
      groupName: Certificates
      groupDescription: |-

        Certificate preview, generation, and PDF download (when enabled for the deployment).
      subgroup: ''
      subgroupDescription: ''
      title: 'Queue certificate PDF generation'
      description: 'Dispatches async PDF generation when status is `pending`. Poll until `pdf_status` is `ready`.'
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      certificate_id:
        custom: []
        name: certificate_id
        description: 'The ID of the certificate.'
        required: true
        example: 17
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      certificate:
        custom: []
        name: certificate
        description: 'Certificate ID.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      certificate_id: 17
      certificate: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message":"Certificate PDF is ready.","pdf_status":"ready"}'
        headers: []
        description: ''
      -
        custom: []
        status: 202
        content: '{"message":"Certificate generation started.","pdf_status":"pending"}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
