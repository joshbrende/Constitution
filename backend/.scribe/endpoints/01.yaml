name: Authentication
description: |-

  Register, login, token refresh, and password recovery for mobile and API clients.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/register
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Register, login, token refresh, and password recovery for mobile and API clients.
      subgroup: ''
      subgroupDescription: ''
      title: 'Register a new member account'
      description: 'Creates a student-role user and returns Sanctum access and refresh tokens.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: 'First name.'
        required: true
        example: Tariro
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      surname:
        custom: []
        name: surname
        description: 'Last name.'
        required: true
        example: Moyo
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      email:
        custom: []
        name: email
        description: 'Unique email address.'
        required: true
        example: member@example.org.zw
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Minimum 8 characters.'
        required: true
        example: SecurePass123!
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      accept_terms:
        custom: []
        name: accept_terms
        description: 'Must be `true` or `1`.'
        required: true
        example: 'true'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      province_id:
        custom: []
        name: province_id
        description: 'optional Province ID from `GET /api/v1/provinces` (1=Bulawayo, 2=Harare, …).'
        required: false
        example: 2
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      password_confirmation:
        custom: []
        name: password_confirmation
        description: 'Must match `password`.'
        required: true
        example: SecurePass123!
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: Tariro
      surname: Moyo
      email: member@example.org.zw
      password: SecurePass123!
      accept_terms: 'true'
      province_id: 2
      password_confirmation: SecurePass123!
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"user":{},"access_token":"1|…","refresh_token":"…"}'
        headers: []
        description: Success
      -
        custom: []
        status: 422
        content: '{"message":"The email has already been taken.","errors":{"email":["The email has already been taken."]}}'
        headers: []
        description: 'Validation error'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/login
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Register, login, token refresh, and password recovery for mobile and API clients.
      subgroup: ''
      subgroupDescription: ''
      title: Login
      description: 'Returns access and refresh tokens. Previous tokens for this user are revoked.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: 'Account email.'
        required: true
        example: member@example.org.zw
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Account password.'
        required: true
        example: SecurePass123!
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: member@example.org.zw
      password: SecurePass123!
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"user":{},"access_token":"1|…","refresh_token":"…"}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"message":"The provided credentials are incorrect."}'
        headers: []
        description: 'Invalid credentials'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/forgot-password
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Register, login, token refresh, and password recovery for mobile and API clients.
      subgroup: ''
      subgroupDescription: ''
      title: 'Forgot password'
      description: 'Sends a password reset link when the email exists. Rate limited to 3 requests per hour per email.'
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: 'Registered account email.'
        required: true
        example: mobile.test@zanupf.org.zw
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: mobile.test@zanupf.org.zw
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message":"We have emailed your password reset link."}'
        headers: []
        description: 'Reset link sent'
      -
        custom: []
        status: 422
        content: '{"message":"We can''t find a user with that email address."}'
        headers: []
        description: 'Unknown email'
      -
        custom: []
        status: 429
        content: '{"message":"Too many password reset requests for this email. Please try again in about an hour."}'
        headers: []
        description: 'Rate limited'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/refresh
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Register, login, token refresh, and password recovery for mobile and API clients.
      subgroup: ''
      subgroupDescription: ''
      title: 'Refresh tokens'
      description: |-
        Rotates the refresh token and issues a new access token. Rate limited.

        **Try it in these docs:** run **Login** (or **Register**) first, copy the `refresh_token`
        from the JSON response, paste it into the field below, then send this request.
        Each refresh returns a new refresh token — the old one is invalidated.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      refresh_token:
        custom: []
        name: refresh_token
        description: 'Paste `refresh_token` from the Login or Register response (64 chars).'
        required: true
        example: PASTE_REFRESH_TOKEN_FROM_LOGIN
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      refresh_token: PASTE_REFRESH_TOKEN_FROM_LOGIN
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"user":{},"access_token":"1|…","refresh_token":"…"}'
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"message":"Refresh token expired or invalid. Please sign in again."}'
        headers: []
        description: 'Invalid token'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/logout
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Register, login, token refresh, and password recovery for mobile and API clients.
      subgroup: ''
      subgroupDescription: ''
      title: Logout
      description: |-
        Revokes the current access token and all refresh tokens for the user.

        **Try it in these docs:** run **Login** first, click **Try it out**, set **Authorization** to
        `Bearer {access_token}` from the login response, then send.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message":"Logged out successfully."}'
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"error":"unauthenticated","message":"Unauthenticated."}'
        headers: []
        description: 'Missing token'
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
