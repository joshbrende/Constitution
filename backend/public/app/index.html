    <!-- Recover from stale service-worker / hashed-asset mismatches after rebuilds -->
    <script>
      (function () {
        var KEY = 'pwa_blank_recover_v1';
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui;background:#020617;color:#f9fafb;text-align:center">' +

            '<p style="font-size:13px;color:#9ca3af;margin:0">If this stays blank, clear Safari website data for this site.</p></div></div>';
          if (sessionStorage.getItem(KEY) === '1') return;
          sessionStorage.setItem(KEY, '1');
          var done = function () {
            location.reload();
          };
          if (!('serviceWorker' in navigator)) {
            done();
            return;
          }
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .then(function () {
              if (!caches || !caches.keys) return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            })
            .finally(done);
        }, 3500);
      })();
