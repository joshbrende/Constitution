server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(jpg|jpeg|png|gif|svg|css|js|ico|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
    }

    # DOCS_AUTH_START — enable with: bash backend/scripts/setup-docs-auth.sh <username>
    # location ^~ /docs/ {
    #     auth_basic "ZANUPF API docs";
    #     auth_basic_user_file /var/www/html/storage/app/private/.htpasswd-docs;
    #     try_files $uri $uri/ =404;
    # }
    # DOCS_AUTH_END
}

