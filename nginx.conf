server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    # Never long-cache the SPA shell (stale HTML → blank page after rebuilds)
    location = /app/index.html {
        alias /var/www/html/public/app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Hashed bundles — safe to cache hard
    location ^~ /app/assets/ {
        alias /var/www/html/public/app/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ZANUPF PWA (built from /PWA → backend/public/app)
    location /app/ {
        alias /var/www/html/public/app/;
        try_files $uri $uri/ /app/index.html;
        # HTML navigations under /app/* should not be cached by browsers/proxies
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Cold PHP-FPM + Windows bind mounts can exceed the default 60s on first hit.
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    location ~* \.(jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
    }

    # DOCS_AUTH_START — enable with: bash backend/scripts/setup-docs-auth.sh <username>
    # location ^~ /docs/ {
    #     auth_basic "ZANUPF API docs";
    #     auth_basic_user_file /var/www/html/storage/app/private/.htpasswd-docs;
    #     try_files $uri $uri/ =404;
    # }
    # DOCS_AUTH_END
}
